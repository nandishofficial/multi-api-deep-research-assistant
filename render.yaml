# Render Blueprint: https://render.com/docs/blueprint-spec
# New → Blueprint → pick this repo. Fill in the `sync: false` values when prompted.
services:
  - type: web
    name: deep-research-assistant
    runtime: docker
    # The free plan sleeps after 15 idle minutes, which pauses the in-process worker
    # mid-research. Use "starter" (always on), or keep "free" and enable the
    # cron-tick GitHub Action, which wakes the service every 5 minutes.
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: deep-research-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false # e.g. https://deep-research-assistant.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: gmail
      - key: WORKER_MODE
        value: inline

databases:
  - name: deep-research-db
    plan: free
    databaseName: research
